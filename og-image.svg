<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="796" cy="658" r="72" fill="#a0522d" opacity="0.13"/>
    <circle cx="1000" cy="46" r="91" fill="#a0522d" opacity="0.09"/>
    <circle cx="1030" cy="399" r="27" fill="#a0522d" opacity="0.19"/>
    <circle cx="1051" cy="468" r="43" fill="#a0522d" opacity="0.20"/>
    <circle cx="565" cy="150" r="50" fill="#a0522d" opacity="0.14"/>
    <circle cx="-24" cy="453" r="85" fill="#a0522d" opacity="0.14"/>
    <rect x="82" y="598" width="73" height="53" rx="8" fill="#8b4513" opacity="0.05" transform="rotate(27, 793, 410)"/>
    <rect x="-2" y="476" width="75" height="91" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(38, 1043, -24)"/>
    <rect x="814" y="-77" width="69" height="57" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(28, 1139, 399)"/>
    <rect x="681" y="75" width="33" height="35" rx="8" fill="#8b4513" opacity="0.03" transform="rotate(38, 1009, 515)"/>
    <rect x="1284" y="238" width="58" height="73" rx="8" fill="#8b4513" opacity="0.05" transform="rotate(16, 692, 172)"/>
    <rect x="1230" y="45" width="94" height="41" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(30, 745, 630)"/>
    <rect x="149" y="312" width="83" height="55" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(43, 1291, 665)"/>
    <rect x="602" y="152" width="50" height="36" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(43, 222, 513)"/>
    <polygon points="957,240 999,324 915,324" fill="#a0522d" opacity="0.12"/>
    <polygon points="1183,33 1240,147 1126,147" fill="#a0522d" opacity="0.04"/>
    <polygon points="957,538 1036,696 878,696" fill="#a0522d" opacity="0.09"/>
    <polygon points="1211,-9 1258,85 1164,85" fill="#a0522d" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,560 C360,595 840,525 1200,560 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    SEO 오토파일럿 가격
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 프록시 보안
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 SEO 오토파일럿 가격 — 프록시 보안
  </text>
</svg>